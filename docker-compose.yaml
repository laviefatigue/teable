version: '3.9'

services:
  teable:
    image: ghcr.io/teableio/teable:latest
    restart: always
    labels:
      # Coolify specific labels for Traefik routing
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.teable.rule=Host(`${SERVICE_FQDN}`)"
      - "traefik.http.routers.teable.entrypoints=websecure"
      - "traefik.http.routers.teable.tls.certresolver=letsencrypt"
      - "traefik.http.services.teable.loadbalancer.server.port=3000"
    volumes:
      - teable-data:/app/.assets:rw
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE}
      - NEXT_ENV_IMAGES_ALL_REMOTE=true
    networks:
      - teable-network
    depends_on:
      teable-db:
        condition: service_healthy
      teable-cache:
        condition: service_healthy

  teable-db:
    image: postgres:15.4
    restart: always
    volumes:
      - teable-db:/var/lib/postgresql/data:rw
    environment:
      - TZ=${TIMEZONE}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - teable-network
    healthcheck:
      test: ['CMD-SHELL', "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
      interval: 10s
      timeout: 3s
      retries: 3

  teable-cache:
    image: redis:7.2.4
    restart: always
    volumes:
      - teable-cache:/data:rw
    networks:
      - teable-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  teable-network:
    driver: bridge

volumes:
  teable-data: {}
  teable-db: {}
  teable-cache: {}